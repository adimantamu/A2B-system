# Product registry.
#
# A product is a known service offering — one row per thing a vendor sells.
# The registry wins on taxonomy: when the old Lenni 27-product catalog and this
# registry disagree, this file is right.
#
# `site_phrases` is the matcher's raw material. These are deliberately written
# in BANK VOICE — the words that appear on a vendor's own website — not in
# customer voice. The old loan_products.yaml keywords ("apartment", "warehouse
# for my business") were written for a borrower typing into a chat box and match
# marketing copy poorly. Both vocabularies are legitimate; they are just aimed at
# different text.
#
# tier 1 = highest-volume, template exists and is production-ready
# tier 2 = template exists, lower volume
# tier 3 = catalogued, template not written yet (ingest still classifies it,
#          which is how unmatched demand reaches the roadmap)

products:
  # ---------------------------------------------------------------- banking
  - key: uw-multifamily-perm
    industry: banking
    name: Multifamily Permanent
    tier: 1
    template: uw-multifamily-perm
    site_phrases:
