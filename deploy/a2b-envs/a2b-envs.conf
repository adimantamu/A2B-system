    # Injected between mock-api.js and app.js: after the demo has replaced
    # window.fetch, and before the app makes its first call through it. The
    # match is on the src prefix because the ?v= cache-buster changes with
    # every build. The live-links overlay goes first, between the sign-in
    # overlay and the demo: it sees the demo's side of each sign-in, which is
    # where it learns the user's organisations, and never the real one, which
    # the sign-in overlay sends straight to the network.
    # text/html is always in sub_filter_types, so it is not restated here.
    sub_filter '<script src="/app.js' '<script src="/a2b-live-links.js"></script><script src="/a2b-real-auth.js"></script><script src="/app.js';
    sub_filter_once on;

    # The same files staging serves: these paths are symlinks to one copy each
    # under /opt/a2b-envs/overlay, so the two environments cannot drift apart.
    location = /a2b-real-auth.js {
        alias /opt/a2b-envs/overlay/sandbox/a2b-real-auth.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-A2B-Env "sandbox" always;
    }

    location = /a2b-live-links.js {
        alias /opt/a2b-envs/overlay/sandbox/a2b-live-links.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-A2B-Env "sandbox" always;
    }

    # A bank's start buttons, and the rows behind them. The workspace sends its
    # edits to /api/live/ with the real session cookie, which the application
    # checks; reads are public.
    location ^~ /go/ {
        limit_req zone=a2b_live burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # The redirect carries the whole prompt in its Location header, past
        # the default buffer for a response's headers.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    location ^~ /api/live/ {
        limit_req zone=a2b_live burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Authentication is answered by the application, not by the fixture.
    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The tunnel reaches nginx over plain http, so $scheme here is not what
        # the browser used and would mark the session cookie insecure. The
        # browser's scheme is the true one, so it is stated rather than copied.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    # The reset flow is served by the application. A link out of an email has
    # to land on a real document, and the demo is a single-page app that would
    # route these to a view it does not have.
    location ~ ^/(forgot-password|reset-password)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Those pages finish by sending you to the application's own console, which
    # is not what sandbox serves. The demo lives at the root, and the overlay
    # picks the real session up from there.
    location = /console/ { return 302 /; }

    location = /live-scan {
