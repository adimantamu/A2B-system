# Three fixed A2B environments on one EC2 instance.
#
#   production  :80    static -> /opt/a2b-envs/production
#   staging     :8082  static -> /opt/a2b-envs/staging
#   sandbox     :8083  static -> /opt/a2b-envs/sandbox
#
# The three document roots contain the same demo build, and all three serve it
# the same way: real sign-in, the live-link overlay, and no shared password.
# Each server keeps a different X-A2B-Env header and fixed Cloudflare hostname.
# The real A2B API remains internal on 127.0.0.1:8000.

# Live start links (/go/ and /api/live/) in all three environments. Keyed on
# the visitor Cloudflare saw: every request arrives from cloudflared on this
# machine, so the peer address would put every visitor in one bucket. A click
# writes an event row, which is what makes an unthrottled link worth limiting.
limit_req_zone $http_cf_connecting_ip zone=a2b_live:10m rate=60r/m;

# ---------------------------------------------------------------- production
#
# Production is the sandbox build plus the same real sign-in staging and
# sandbox run. The document root is re-mirrored from sandbox, so nothing here
# may depend on a file inside it. The overlay is injected on the way out.
#
# The shared password used to cover this environment. It sat in front of the
# sign-in screen, so the real login behind it could not be reached. It is
# gone, which is what makes this environment the same as the other two.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/a2b-envs/production;
    index index.html;

    access_log /var/log/nginx/a2b-production.access.log;
    error_log  /var/log/nginx/a2b-production.error.log;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-A2B-Env    "production"        always;

    # An entry prompt can carry a sizeable document.
    client_max_body_size 25m;

    # The same injection as staging and sandbox. The live-links overlay goes
    # first, between the sign-in overlay and the demo.
    # text/html is always in sub_filter_types, so it is not restated here.
    sub_filter '<script src="/app.js' '<script src="/a2b-live-links.js"></script><script src="/a2b-real-auth.js"></script><script src="/app.js';
    sub_filter_once on;

    location = /a2b-real-auth.js {
        alias /opt/a2b-envs/overlay/production/a2b-real-auth.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-A2B-Env "production" always;
    }

    location = /a2b-live-links.js {
        alias /opt/a2b-envs/overlay/production/a2b-live-links.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-A2B-Env "production" always;
    }

    location ^~ /go/ {
        limit_req zone=a2b_live burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # The redirect carries the whole prompt in its Location header, past
        # the default buffer for a response's headers.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    location ^~ /api/live/ {
        limit_req zone=a2b_live burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Authentication is answered by the application, not by the fixture.
    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The tunnel reaches nginx over plain http, so $scheme here is not what
        # the browser used and would mark the session cookie insecure. The
        # browser's scheme is the true one, so it is stated rather than copied.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    location ~ ^/(forgot-password|reset-password)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /console/ { return 302 /; }

    location = /live-scan {
        proxy_pass http://127.0.0.1:8000/api/ingest/scan;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type application/json;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    location ~ ^/(AGENTS\.md|AWS-ENVIRONMENTS\.md|DEV-BRIEF-a2b-system\.md|README\.md|\.gitignore|\.vercelignore|middleware\.js|vercel\.json)$ { return 404; }
    location ~ ^/(_archive|_system-emails|deploy|\.vercel|\.git)(/|$) { return 404; }
    location / { try_files $uri $uri.html $uri/ /index.html; }
}

# -------------------------------------------------------------------- staging
#
# Staging is the sandbox build plus real authentication.
#
# The document root is re-mirrored from sandbox every minute by
# a2b-envs-mirror.timer, so nothing here may depend on a file inside it. The
# overlay script lives outside the root and is injected into the page on the
# way out, which is why Doak's build needs no edit and the mirror has nothing
# of ours to delete.
#
# The shared password is absent here, as it is on production and sandbox. It
# sat in front of the sign-in screen, so while it was there the real login
# behind it could not be reached.
server {
    listen 127.0.0.1:8082;
    server_name _;

    root /opt/a2b-envs/staging;
    index index.html;

    access_log /var/log/nginx/a2b-staging.access.log;
    error_log  /var/log/nginx/a2b-staging.error.log;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-A2B-Env    "staging"           always;

    # An entry prompt can carry a sizeable document.
    client_max_body_size 25m;

    include /etc/nginx/snippets/plaid-identity-verification.conf;

    # Injected between mock-api.js and app.js: after the demo has replaced
    # window.fetch, and before the app makes its first call through it. The
    # match is on the src prefix because the ?v= cache-buster changes with
    # every build. The live-links overlay goes first, between the sign-in
    # overlay and the demo: it sees the demo's side of each sign-in, which is
    # where it learns the user's organisations, and never the real one, which
    # the sign-in overlay sends straight to the network.
    #
    # TheTerms goes ahead of both, on staging only (see /theterms/ below). It
    # reads the organisation from the demo's own API, so it has to find
    # window.fetch as mock-api.js left it, before the sign-in overlay wraps it.
    # The ProofLink preview only rewrites a page and could go anywhere; it sits
    # with TheTerms as the other staging-only script (see below).
    # text/html is always in sub_filter_types, so it is not restated here.
    sub_filter '<script src="/app.js' '<script src="/theterms/engine.js"></script><script src="/theterms/view.js"></script><script src="/theterms/theterms.js"></script><script src="/prooflink-preview.js"></script><script src="/a2b-live-links.js"></script><script src="/a2b-real-auth.js"></script><script src="/app.js';
    sub_filter_once on;

    # Served from outside the mirrored root. That is the whole reason it
    # survives the next mirror.
    location = /a2b-real-auth.js {
        alias /opt/a2b-envs/overlay/staging/a2b-real-auth.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-A2B-Env "staging" always;
    }

    location = /a2b-live-links.js {
        alias /opt/a2b-envs/overlay/staging/a2b-live-links.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-A2B-Env "staging" always;
    }

    # TheTerms preview: the loan calculator Doak is trying on staging before
    # it goes anywhere else. Its scripts, the customer's quote page and the
    # website calculator, served from outside the mirrored root. Production
    # and sandbox have neither this location nor the script tags above, and
    # the overlay directory links it for staging alone. Promoting it means
    # the same two changes in the production block plus its link; dropping it
    # means reverting them here.
    location ^~ /theterms/ {
        alias /opt/a2b-envs/overlay/staging/theterms/;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-A2B-Env "staging" always;
    }

    # ProofLink preview: until #141 moves ProofLink into the workspace, its
    # page on staging points to the Plaid Sandbox preview that the include
    # above routes at /plaid-demo/. Staging alone has that route, so staging
    # alone has this location, the script tag above and the overlay link.
    location = /prooflink-preview.js {
        alias /opt/a2b-envs/overlay/staging/prooflink-preview.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-A2B-Env "staging" always;
    }

    # A bank's start buttons, and the rows behind them. The workspace sends its
    # edits to /api/live/ with the real session cookie, which the application
    # checks; reads are public.
    location ^~ /go/ {
        limit_req zone=a2b_live burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # The redirect carries the whole prompt in its Location header, past
        # the default buffer for a response's headers.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    location ^~ /api/live/ {
        limit_req zone=a2b_live burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Authentication is answered by the application, not by the fixture.
    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The tunnel reaches nginx over plain http, so $scheme here is not what
        # the browser used and would mark the session cookie insecure. The
        # browser's scheme is the true one, so it is stated rather than copied.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    # The reset flow is served by the application. A link out of an email has
    # to land on a real document, and the demo is a single-page app that would
    # route these to a view it does not have.
    location ~ ^/(forgot-password|reset-password)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Those pages finish by sending you to the application's own console, which
    # is not what staging serves. The demo lives at the root, and the overlay
    # picks the real session up from there.
    location = /console/ { return 302 /; }

    location = /live-scan {
        proxy_pass http://127.0.0.1:8000/api/ingest/scan;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type application/json;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    # Same refusal as the sandbox block: these files are not part of the
    # demo. Sandbox lacks them in staging/production via the mirror; the
    # 404 keeps all three environments answering the same way.
    location ~ ^/(AGENTS\.md|AWS-ENVIRONMENTS\.md|DEV-BRIEF-a2b-system\.md|README\.md|\.gitignore|\.vercelignore|middleware\.js|vercel\.json)$ { return 404; }
    location ~ ^/(_archive|_system-emails|deploy|\.vercel|\.git)(/|$) { return 404; }
    location / { try_files $uri $uri.html $uri/ /index.html; }
}
# -------------------------------------------------------------------- sandbox
#
# Sandbox is Doak's build plus the same real authentication staging runs.
#
# This block is deliberately a copy of the staging one. The differences are the
# port, the document root, the environment header, and nothing else: the same
# overlay file is served here, the same auth paths go to the application, and
# the same reset pages are proxied. If the two ever need to diverge, that is a
# decision to make on purpose rather than by letting them drift.
#
# The Plaid demo include is not here. It is staging-only by its own comment, and
# it is not part of sign-in.
#
# The shared password is absent here, as it is on production and staging. It
# sat in front of the sign-in screen, so nothing behind it could be reached.
#
# Nothing here may depend on a file inside the document root: sandbox is the
# source the mirror copies from, and the overlay is served from outside it.
server {
    listen 127.0.0.1:8083;
    server_name _;

    root /opt/a2b-envs/sandbox;
    index index.html;

    access_log /var/log/nginx/a2b-sandbox.access.log;
    error_log  /var/log/nginx/a2b-sandbox.error.log;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-A2B-Env    "sandbox"           always;

    # An entry prompt can carry a sizeable document.
