        proxy_connect_timeout 10s;
    }

    # Internal repo files ride along here because sandbox is the mirror
    # source, but staging and production never receive them. Refuse them
    # so all three environments answer the same way for non-demo paths.
    location ~ ^/(AGENTS\.md|AWS-ENVIRONMENTS\.md|DEV-BRIEF-a2b-system\.md|README\.md|\.gitignore|\.vercelignore|middleware\.js|vercel\.json)$ { return 404; }
    location ~ ^/(_archive|_system-emails|deploy|\.vercel|\.git)(/|$) { return 404; }
    location / { try_files $uri $uri.html $uri/ /index.html; }
