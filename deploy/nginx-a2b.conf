# Reverse proxy for the A2B service.
#
# Everything is proxied to uvicorn on the loopback: the console is served by the
# app itself (StaticFiles), so there is no split between a static root and an
# API prefix to keep in sync.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/a2b.access.log;
    error_log  /var/log/nginx/a2b.error.log;

    client_max_body_size 25m;

    # The scan endpoint fetches a third-party site before it answers.
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
